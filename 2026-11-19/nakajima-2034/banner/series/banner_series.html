<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>全7回の解説バナー</title>
<style>
@font-face {
  font-family: "Noto Serif Display";
  src: url("file:///usr/share/fonts/truetype/sand-box/google/Noto%20Serif%20Display/NotoSerifDisplay-VariableFont_wdth,wght.ttf") format("truetype");
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
}
html, body { margin: 0; padding: 0; background: #111; }
#stage {
  --ink: #1B2638;
  --paper: #F3E8D2;
  --cream: #FFF6E6;
  --clay: #C45C2A;
  --year-color: var(--ink);
  --sf: 1;
  --band: 122px;
  --biblio: 168px;
  --year-size: 100px;
  --year-top: 126px;
  --year-left: 50%;
  --head-bottom: 246px;
  --head-left: 48px;
  --head-max: 620px;
  --h1-size: 52px;
  --h2-size: 26px;
  --bg-top: 0px;
  --bg-w: 1280px;
  --bg-h: 670px;
  position: relative;
  width: 1280px;
  height: 670px;
  overflow: hidden;
  background: #1B2638;
  color: var(--ink);
  font-family: "Noto Sans CJK JP", sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.bg {
  position: absolute;
  z-index: 0;
  pointer-events: none;
  width: var(--bg-w);
  height: var(--bg-h);
  left: 0;
  top: var(--bg-top);
  object-fit: fill;
}
.year {
  position: absolute;
  left: var(--year-left);
  top: var(--year-top);
  transform: translateX(-50%);
  z-index: 2;
  font-family: "Noto Serif Display", "Noto Serif CJK JP", serif;
  font-weight: 650;
  font-size: var(--year-size);
  font-variation-settings: "wght" 650, "wdth" 92;
  letter-spacing: 0.05em;
  line-height: 1;
  color: var(--year-color);
  pointer-events: none;
  font-feature-settings: "tnum" 1;
}
.headline {
  position: absolute;
  left: var(--head-left);
  bottom: var(--head-bottom);
  z-index: 4;
  text-align: left;
  background: var(--cream);
  padding: calc(10px * var(--sf)) calc(22px * var(--sf)) calc(12px * var(--sf));
  box-sizing: border-box;
  max-width: var(--head-max);
}

.h1 {
  font-size: var(--h1-size);
  font-weight: 700;
  line-height: 1.12;
  letter-spacing: -0.03em;
  font-feature-settings: "palt" 1;
  margin: 0;
  white-space: nowrap;
}
.h1 .em { color: var(--clay); }
.h1 .gap { display: inline-block; width: 0.08em; }
.h2 {
  font-size: var(--h2-size);
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.02em;
  font-feature-settings: "palt" 1;
  margin: calc(4px * var(--sf)) 0 0;
  color: var(--ink);
  white-space: nowrap;
}
.band {
  position: absolute;
  left: 0; right: 0; top: 0;
  height: var(--band);
  background: var(--ink);
  color: var(--paper);
  z-index: 6;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 calc(48px * var(--sf));
  box-sizing: border-box;
}
.band .left { display: flex; align-items: center; }
.band .mark {
  width: calc(10px * var(--sf));
  height: calc(10px * var(--sf));
  background: var(--clay);
  margin-right: calc(14px * var(--sf));
  flex: none;
}
.band .series {
  font-size: calc(42px * var(--sf));
  font-weight: 700;
  letter-spacing: 0.06em;
  font-feature-settings: "palt" 1;
  line-height: 1;
  white-space: nowrap;
}
.band .pivot {
  font-size: calc(30px * var(--sf));
  font-weight: 700;
  letter-spacing: 0.04em;
  font-feature-settings: "palt" 1;
  line-height: 1.2;
  white-space: nowrap;
  color: var(--paper);
}
.biblio {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: var(--biblio);
  background: var(--ink);
  color: var(--paper);
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px calc(48px * var(--sf));
  box-sizing: border-box;
  text-align: center;
}
#stage.s1920 .biblio { padding-top: 60px; padding-bottom: 60px; }
.biblio .title {
  /* line 1 is longer (title + author + publisher); slightly smaller than v4 so it clears 40px */
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-feature-settings: "palt" 1;
  line-height: 1;
  margin: 0;
  white-space: nowrap;
}
.biblio .credit {
  /* same size as the author name on line 1, so "解説：萩野貴拓" is unmistakable */
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 0.04em;
  font-feature-settings: "palt" 1;
  line-height: 1;
  margin: 8px 0 0;
  white-space: nowrap;
}
#stage.s1920 .biblio .title,
#stage.s1920 .biblio .credit { font-size: 54px; }
#stage.s1920 .biblio .credit { margin-top: 12px; }
</style>
</head>
<body>
<div id="stage">
  <img class="bg" id="bg" alt="">
  <div class="year" id="year">2034</div>
  <div class="headline" id="headline">
    <p class="h1" id="h1"></p>
    <p class="h2" id="h2"></p>
  </div>
  <header class="band" id="band">
    <div class="left">
      <span class="mark" aria-hidden="true"></span>
      <span class="series" id="series"></span>
    </div>
    <div class="pivot" id="pivot">本とPIVOTでの対談から読む</div>
  </header>
  <footer class="biblio" id="biblio">
    <p class="title" id="booktitle">『２０３４ 未来予測――AI（きみ）のいる明日』中島聡 著（徳間書店）</p>
    <p class="credit" id="credit">解説：萩野貴拓</p>
  </footer>
</div>
<script>
const Q = new URLSearchParams(location.search);
const CHAPTERS = {
  ch0: {
    series: '全7回の解説・序章',
    h1: 'AIが隣にいる<span class="gap"></span><span class="em">8年後</span>',
    h2: '仕事と暮らしはどう変わる？',
    bg: {
      1280: '../../bg/ch0/v3/bg_open_r1_1280x670.png',
      1920: '../../bg/ch0/v3/bg_open_r1_1920x1080.png'
    },
    // v4 A typography, only the bottom band text changes
    layout: {
      1280: { yearTop: 126, yearSize: 100, yearLeft: '50%', yearColor: '#1B2638', headBottom: 246, headLeft: 48, bgTop: 0, biblio: 168, band: 122 },
      1920: { yearTop: 208, yearSize: 156, yearLeft: '50%', yearColor: '#1B2638', headBottom: 470, headLeft: 72, bgTop: 0, biblio: 270, band: 200 }
    }
  },
  ch1: {
    series: '全7回の解説・第1回',
    h1: '亡くなった人と、<span class="em">AIで暮らす</span>',
    h2: '声と記憶は、どこまで残せる？',
    bg: {
      1280: '../../bg/series/ch1_a_1280x670.png',
      1920: '../../bg/series/ch1_a_1920x1080.png'
    },
    layout: {
      1280: { yearTop: 128, yearSize: 84, yearLeft: '1060px', yearColor: '#F3E8D2', headBottom: 422, headLeft: 48, bgTop: 0, biblio: 168, band: 122 },
      1920: { yearTop: 210, yearSize: 126, yearLeft: '1590px', yearColor: '#F3E8D2', headBottom: 680, headLeft: 72, bgTop: 0, biblio: 270, band: 200 }
    }
  },
  ch2: {
    series: '全7回の解説・第2回',
    h1: 'スマホの次は、<span class="em">知能</span>',
    h2: '記憶と決済を、どこに預ける？',
    bg: {
      1280: '../../bg/series/v2/ch2_s3_1280x670.png',
      1920: '../../bg/series/v2/ch2_s3_1920x1080.png'
    },
    layout: {
      1280: { yearTop: 126, yearSize: 84, yearLeft: '1080px', yearColor: '#1B2638', headBottom: 422, headLeft: 48, bgTop: 0, biblio: 168, band: 122 },
      1920: { yearTop: 208, yearSize: 126, yearLeft: '1620px', yearColor: '#1B2638', headBottom: 680, headLeft: 72, bgTop: 0, biblio: 270, band: 200 }
    }
  },
  ch3: {
    series: '全7回の解説・第3回',
    // line 2 rewritten to drop the repeated「誰のため」; h1 wraps so the box ends left of the robot's head
    // 3-line h1 so the box stays in the left sky and clears dad, mum, the girl and the robot
    h1: '無料の<br>ロボットは、<br><span class="em">誰のため</span>',
    h2: '便利さの代わりに、<br>何を渡す？',
    bg: {
      1280: '../../bg/series/v2/ch3_t4_1280x670.png',
      1920: '../../bg/series/v2/ch3_t4_1920x1080.png'
    },
    layout: {
      1280: { yearTop: 128, yearSize: 80, yearLeft: '1120px', yearColor: '#1B2638', headBottom: 272, headLeft: 48, headMax: 300, bgTop: 0, biblio: 168, band: 122 },
      1920: { yearTop: 210, yearSize: 120, yearLeft: '1680px', yearColor: '#1B2638', headBottom: 468, headLeft: 72, headMax: 450, bgTop: 0, biblio: 270, band: 200 }
    }
  },
  ch4: {
    series: '全7回の解説・第4回',
    h1: '操縦する人から、<span class="em">指揮する人へ</span>',
    h2: '空を飛ぶ仕事は、どう変わる？',
    bg: {
      1280: '../../bg/series/ch4_b_1280x670.png',
      1920: '../../bg/series/ch4_b_1920x1080.png'
    },
    layout: {
      1280: { yearTop: 128, yearSize: 88, yearLeft: '1100px', yearColor: '#1B2638', headBottom: 422, headLeft: 48, bgTop: 0, biblio: 168, band: 122 },
      1920: { yearTop: 210, yearSize: 132, yearLeft: '1650px', yearColor: '#1B2638', headBottom: 680, headLeft: 72, bgTop: 0, biblio: 270, band: 200 }
    }
  },
  ch5: {
    series: '全7回の解説・第5回',
    h1: '先に来るのは、<br><span class="em">AI前提の会社</span>',
    h2: '仕事の形は、いまから変わる',
    bg: {
      1280: '../../bg/series/v2/ch5_s3_1280x670.png',
      1920: '../../bg/series/v2/ch5_s3_1920x1080.png'
    },
    layout: {
      1280: { yearTop: 128, yearSize: 84, yearLeft: '1140px', yearColor: '#1B2638', headBottom: 364, headLeft: 48, headMax: 370, bgTop: 0, biblio: 168, band: 122 },
      1920: { yearTop: 210, yearSize: 126, yearLeft: '1710px', yearColor: '#1B2638', headBottom: 593, headLeft: 72, headMax: 555, bgTop: 0, biblio: 270, band: 200 }
    }
  },
  ch6: {
    series: '全7回の解説・まとめ',
    // 3-line wrap + slightly smaller h1 so the box stays left of the people; 2034 sits in the right sky, clear of Fuji and the pagoda
    h1: '任せる<br>範囲を、<br><span class="em">どう設計する</span>',
    h2: '2034年の問いを、<br>いま引き取る',
    bg: {
      1280: '../../bg/series/v2/ch6_s3_1280x670.png',
      1920: '../../bg/series/v2/ch6_s3_1920x1080.png'
    },
    layout: {
      1280: { yearTop: 128, yearSize: 80, yearLeft: '1140px', yearColor: '#1B2638', headBottom: 305, headLeft: 48, headMax: 260, h1Size: 42, bgTop: 0, biblio: 168, band: 122 },
      1920: { yearTop: 210, yearSize: 120, yearLeft: '1710px', yearColor: '#1B2638', headBottom: 505, headLeft: 72, headMax: 390, h1Size: 42, bgTop: 0, biblio: 270, band: 200 }
    }
  }
};

const key = (Q.get('ch') || 'ch0').toLowerCase();
const pack = CHAPTERS[key] || CHAPTERS.ch0;
const size1920 = Q.get('size') === '1920';
const size = size1920 ? 1920 : 1280;
const L = pack.layout[size];
const stage = document.getElementById('stage');
if (size1920) {
  stage.classList.add('s1920');
  stage.style.width = '1920px';
  stage.style.height = '1080px';
  stage.style.setProperty('--sf', '1.5');
  stage.style.setProperty('--bg-w', '1920px');
  stage.style.setProperty('--bg-h', '1080px');
}
stage.style.setProperty('--band', L.band + 'px');
stage.style.setProperty('--biblio', L.biblio + 'px');
stage.style.setProperty('--year-size', L.yearSize + 'px');
stage.style.setProperty('--year-top', L.yearTop + 'px');
stage.style.setProperty('--year-left', L.yearLeft);
stage.style.setProperty('--year-color', L.yearColor);
stage.style.setProperty('--head-bottom', L.headBottom + 'px');
stage.style.setProperty('--head-left', L.headLeft + 'px');
stage.style.setProperty('--head-max', (L.headMax != null ? L.headMax : 620 * (size1920 ? 1.5 : 1)) + 'px');
stage.style.setProperty('--h1-size', ((L.h1Size != null ? L.h1Size : 52) * (size1920 ? 1.5 : 1)) + 'px');
stage.style.setProperty('--h2-size', ((L.h2Size != null ? L.h2Size : 26) * (size1920 ? 1.5 : 1)) + 'px');
stage.style.setProperty('--bg-top', L.bgTop + 'px');

document.getElementById('series').textContent = pack.series;
document.getElementById('h1').innerHTML = pack.h1;
document.getElementById('h2').innerHTML = pack.h2;
const bg = document.getElementById('bg');
bg.src = new URL(pack.bg[size], location.href).href;
bg.addEventListener('error', () => { window.FIG_READY = true; console.error('bg missing'); });
Promise.all([
  document.fonts.ready,
  new Promise((res) => {
    if (bg.complete && bg.naturalWidth) res();
    else { bg.addEventListener('load', res); bg.addEventListener('error', res); }
  })
]).then(() => { requestAnimationFrame(() => { window.FIG_READY = true; }); });
setTimeout(() => { window.FIG_READY = true; }, 3000);
</script>
</body>
</html>
