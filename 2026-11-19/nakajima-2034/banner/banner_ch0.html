<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>全7回の解説・序章 バナー下書き</title>
<style>
@font-face {
  font-family: "Noto Serif Display";
  src: url("file:///usr/share/fonts/truetype/sand-box/google/Noto%20Serif%20Display/NotoSerifDisplay-VariableFont_wdth,wght.ttf") format("truetype");
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
}
html, body { margin: 0; padding: 0; background: #111; }
#stage {
  --ink: #1B2638;
  --ink-2: #24344A;
  --paper: #F3E8D2;
  --cream: #FFF6E6;
  --clay: #C45C2A;
  --sky: #D2DEDC;
  --sf: 1;
  --band: 124px;
  --biblio: 180px;
  position: relative;
  width: 1280px;
  height: 670px;
  overflow: hidden;
  background: var(--sky);
  color: var(--ink);
  font-family: "Noto Sans CJK JP", sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
#stage.s1920 {
  width: 1920px;
  height: 1080px;
  --sf: 1.5;
  --band: 218px;
  --biblio: 313px;
}
svg.scene {
  position: absolute;
  left: 0; right: 0;
  top: var(--band);
  height: calc(100% - var(--band) - var(--biblio));
  width: 100%;
  display: block;
  z-index: 1;
}
#front { z-index: 3; pointer-events: none; }

.year {
  position: absolute;
  left: 50%;
  top: calc(var(--band) + 6px * var(--sf));
  transform: translate(-50%, 0);
  z-index: 2;
  font-family: "Noto Serif Display", "Noto Serif CJK JP", serif;
  font-weight: 650;
  font-style: normal;
  font-size: calc(200px * var(--sf));
  font-variation-settings: "wght" 650, "wdth" 92;
  letter-spacing: 0.05em;
  line-height: 1;
  color: var(--ink);
  pointer-events: none;
  font-feature-settings: "tnum" 1;
}

.headline {
  position: absolute;
  left: 50%;
  bottom: calc(var(--biblio) + 16px * var(--sf));
  transform: translateX(-50%);
  z-index: 4;
  text-align: center;
  background: var(--cream);
  padding: calc(8px * var(--sf)) calc(28px * var(--sf)) calc(10px * var(--sf));
  box-sizing: border-box;
}
.h1 {
  font-size: calc(60px * var(--sf));
  font-weight: 700;
  line-height: 1.12;
  letter-spacing: -0.03em;
  font-feature-settings: "palt" 1;
  margin: 0;
}
.h1 .em { color: var(--clay); }
.h1 .gap { display: inline-block; width: 0.08em; }
.h2 {
  font-size: calc(30px * var(--sf));
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.02em;
  font-feature-settings: "palt" 1;
  margin: calc(4px * var(--sf)) 0 0;
  color: var(--ink);
}

.band {
  position: absolute;
  left: 0; right: 0; top: 0;
  height: var(--band);
  background: var(--ink);
  color: var(--paper);
  z-index: 6;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 calc(48px * var(--sf));
  box-sizing: border-box;
}
.band .left { display: flex; align-items: center; }
.band .mark {
  width: calc(10px * var(--sf));
  height: calc(10px * var(--sf));
  background: var(--clay);
  margin-right: calc(14px * var(--sf));
  flex: none;
}
.band .series {
  font-size: calc(44px * var(--sf));
  font-weight: 700;
  letter-spacing: 0.06em;
  font-feature-settings: "palt" 1;
  line-height: 1;
  white-space: nowrap;
}
.band .pivot {
  font-size: calc(32px * var(--sf));
  font-weight: 700;
  letter-spacing: 0.04em;
  font-feature-settings: "palt" 1;
  line-height: 1.2;
  white-space: nowrap;
  color: var(--paper);
}

.biblio {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: var(--biblio);
  background: var(--ink);
  color: var(--paper);
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(42px * var(--sf)) calc(48px * var(--sf));
  box-sizing: border-box;
  text-align: center;
}
.biblio .title {
  font-size: calc(50px * var(--sf));
  font-weight: 700;
  letter-spacing: -0.02em;
  font-feature-settings: "palt" 1;
  line-height: 1;
  margin: 0;
  white-space: nowrap;
}
.biblio .credit {
  font-size: calc(36px * var(--sf));
  font-weight: 700;
  letter-spacing: 0.04em;
  font-feature-settings: "palt" 1;
  line-height: 1;
  margin: calc(10px * var(--sf)) 0 0;
  white-space: nowrap;
}
</style>
</head>
<body>

        <rect x="194" y="142" width="8" height="10"/><rect x="216" y="160" width="8" height="10"/>

  </svg>

  <header class="band" id="band">

    <p class="credit" id="credit">中島聡 著／徳間書店</p>
  </footer>
</div>
<script>
const Q = new URLSearchParams(location.search);
const VARIANTS = {
  a: {
    h1: 'AIが隣にいる<span class="gap"></span><span class="em">8年後</span>',
    h2: '仕事と暮らしはどう変わる？'
  },
  b: {
    h1: '来る未来で、何を<span class="gap"></span><span class="em">選ぶ</span>',
    h2: '2034年の暮らしを、いま読む'
  },
  c: {
    h1: 'AIの進化は、まだ<span class="gap"></span><span class="em">2合目</span>',
    h2: 'AIがAIを改良する時代の入り口'
  }
};
const v = (Q.get('v') || 'a').toLowerCase();
const pack = VARIANTS[v] || VARIANTS.a;
document.getElementById('h1').innerHTML = pack.h1;
document.getElementById('h2').textContent = pack.h2;
if (Q.get('size') === '1920') document.getElementById('stage').classList.add('s1920');
document.fonts.ready.then(() => {
  requestAnimationFrame(() => { window.FIG_READY = true; });
});
setTimeout(() => { window.FIG_READY = true; }, 2500);
</script>
</body>
</html>
