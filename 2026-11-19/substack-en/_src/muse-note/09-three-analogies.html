<script>
const S=[...document.querySelectorAll('.slide')];let i=0;const ALL=/all/.test(location.search);
if(ALL)document.body.classList.add('all');
function fit(){const k=ALL?Math.min(1,(innerWidth-20)/1920):Math.min(innerWidth/1920,innerHeight/1080);
 S.forEach(s=>{if(ALL){s.style.transform=`scale(${k})`;s.style.marginBottom=(24-1080*(1-k))+'px'}else s.style.transform=`translate(-50%,-50%) scale(${k})`})}
function show(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,k)=>s.classList.toggle('cur',k===i||ALL))}
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
addEventListener('click',e=>{if(!ALL)show(e.clientX>innerWidth/2?i+1:i-1)});
addEventListener('resize',fit);fit();show(0);
</script>
