<html><head><style>
*{margin:0;box-sizing:border-box}
body{width:1600px;height:900px;background:url(bg.jpg) center/cover;font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;position:relative;overflow:hidden}
.c{position:absolute;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
.lab{top:58px;color:#9a5a46;font-weight:700;font-size:22px;letter-spacing:6px;padding:6px 0;border-top:1.5px solid #d49a85;border-bottom:1.5px solid #d49a85}
