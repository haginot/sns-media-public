<html><head><style>
*{margin:0;box-sizing:border-box}
body{width:1600px;height:900px;background:url(bg.jpg) center/cover;font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;position:relative;overflow:hidden}
.c{position:absolute;left:50%;transform:translateX(-50%);text-align:center}
.lab{top:44px;background:#111;color:#fff;font-weight:800;font-size:26px;padding:8px 22px;border-radius:999px}
.h1{top:92px;font-weight:900;font-size:62px;color:#1a1530;white-space:nowrap;-webkit-text-stroke:10px #fff;paint-order:stroke fill;letter-spacing:1px}
.h2{top:156px;font-weight:900;font-size:150px;line-height:1;white-space:nowrap;letter-spacing:2px}
.h2 .g{background:linear-gradient(180deg,#fff6b0 0%,#ffd23a 35%,#e79a00 60%,#ffe27a 80%,#b86e00 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(0 7px 0 #7a3e00)}
.h2 .w{color:#ff5a1f;-webkit-text-stroke:10px #fff;paint-order:stroke fill}
.card{top:345px;width:640px;padding:12px;background:linear-gradient(135deg,#fff3b0,#ffc83a,#fff,#ffb800);border-radius:26px;transform:translateX(-50%) rotate(-2deg);box-shadow:0 18px 0 rgba(120,70,0,.18)}
.card img{width:616px;display:block;border-radius:16px}
.hl{position:absolute;left:12px;top:146px;width:334px;height:112px;border:7px solid #ff5a1f;border-radius:16px}
.t{top:650px;background:#fff;border:4px solid #ffc83a;border-radius:18px;padding:12px 26px;font-weight:800;font-size:27px;color:#1a1530;white-space:nowrap}
.cr{bottom:44px;font-weight:700;font-size:20px;color:#4a4060;background:rgba(255,255,255,.85);padding:4px 14px;border-radius:8px}
</style></head><body>
<div class="c lab">カンリー Techブログ</div>
<div class="c h1">Techトレンド</div>
<div class="c h2"><span class="g">TOP3</span><span class="w">入り！</span></div>
<div class="c card"><img src="shot.png"><div class="hl"></div></div>
<div class="c t">寝てる間に自動で動くAIエージェントを誰でも作れる：10分でわかる pstack 実践ガイド</div>
<div class="c cr">作図：萩野貴拓</div>
</body></html>
