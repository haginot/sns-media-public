<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<body class="$theme $shape" style="--w:$width;--h:$height">
<main>
  $decor
  <header>
    <div class="label">カンリー Techブログ</div>
    <h1><span class="intro">Techトレンド</span><span class="hero">TOP3</span><span class="arrival">入り！</span></h1>
  </header>
  <div class="display">
    $object
    <div class="card">
      <img src="ranking.png" alt="Techトレンドのスクリーンショット。左列の上から2番目が対象記事。">
      <i class="highlight"></i>
    </div>
  </div>
  <footer>
    <div class="title">寝てる間に自動で動くAIエージェントを誰でも作れる：10分でわかる pstack 実践ガイド</div>
    <div class="credit">作図：萩野貴拓</div>
  </footer>
</main>
</body>
</html>
