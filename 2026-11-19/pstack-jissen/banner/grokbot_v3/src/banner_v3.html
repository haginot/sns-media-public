<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    background: #F8F9F7;
    font-family: "Inter Tight", "Inter", "Noto Sans CJK JP", "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  .stage {
    position: relative;
    width: var(--w);
    height: var(--h);
    background: #F8F9F7;
    overflow: hidden;
  }

  .art-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: calc(var(--s) * 44px);
  }

  /* Row 1: Top pills */
  .top-row {
    display: flex;
    align-items: center;
    gap: calc(var(--s) * 12px);
    margin-bottom: calc(var(--s) * 18px);
  }

  .pill-black {
    background: #0D0E12;
    color: #FFFFFF;
    font-family: "Inter", "Noto Sans CJK JP", sans-serif;
    font-weight: 900;
    font-size: calc(var(--s) * 24px);
    letter-spacing: -0.02em;
    padding: calc(var(--s) * 7px) calc(var(--s) * 20px);
    border-radius: 999px;
    line-height: 1.1;
  }

  .pill-orange {
    background: #FF5E00;
    color: #FFFFFF;
    font-weight: 900;
    font-size: calc(var(--s) * 21px);
    padding: calc(var(--s) * 8px) calc(var(--s) * 18px);
    border-radius: 999px;
    line-height: 1.1;
    transform: rotate(-1.5deg);
    box-shadow: calc(var(--s) * 3px) calc(var(--s) * 3px) 0 #0D0E12;
  }

  .dev-label {
    font-size: calc(var(--s) * 21px);
    font-weight: 800;
    color: #2A2E37;
    letter-spacing: -0.01em;
    background: #FFFFFF;
    border: calc(var(--s) * 2px) solid #DCE1EA;
    padding: calc(var(--s) * 6px) calc(var(--s) * 16px);
    border-radius: 999px;
  }

  /* Row 2: Hero Main Title */
  .hero-title {
    text-align: center;
    line-height: 1.13;
    letter-spacing: -0.035em;
    margin-bottom: calc(var(--s) * 20px);
  }

  .hero-line1 {
    display: block;
    font-size: calc(var(--s) * 80px);
    font-weight: 900;
    color: #0E86FF;
  }

  .hero-line2 {
    display: block;
    font-size: calc(var(--s) * 69px);
    font-weight: 900;
    color: #0D0E12;
    margin-top: calc(var(--s) * 4px);
  }

  /* Row 3: Dynamic Quote Sticker Card */
  .quote-card {
    position: relative;
    background: #FFFFFF;
    border: calc(var(--s) * 3px) solid #0D0E12;
    border-radius: calc(var(--s) * 24px);
    padding: calc(var(--s) * 18px) calc(var(--s) * 36px) calc(var(--s) * 18px) calc(var(--s) * 42px);
    box-shadow: calc(var(--s) * 6px) calc(var(--s) * 6px) 0 #0D0E12;
    transform: rotate(-0.8deg);
    text-align: center;
    margin-bottom: calc(var(--s) * 24px);
    max-width: calc(var(--s) * 880px);
  }

  .quote-stripe {
    position: absolute;
    left: calc(var(--s) * 12px);
    top: calc(var(--s) * 13px);
    bottom: calc(var(--s) * 13px);
    width: calc(var(--s) * 8px);
    border-radius: 999px;
    background: #FF5E00;
  }

  .quote-en {
    font-family: "Inter", sans-serif;
    font-size: calc(var(--s) * 35px);
    font-weight: 900;
    color: #0D0E12;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }

  .quote-en .accent-orange { color: #FF5E00; }

  .quote-jp {
    margin-top: calc(var(--s) * 6px);
    font-size: calc(var(--s) * 26px);
    font-weight: 900;
    color: #1F242D;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .quote-jp .accent-orange { color: #FF5E00; }
  .quote-jp .accent-blue { color: #0E86FF; }
  .quote-by {
    font-size: calc(var(--s) * 18px);
    font-weight: 700;
    color: #5C6472;
    margin-left: calc(var(--s) * 10px);
  }

  /* Row 4: Floating Dynamic Flow Chips */
  .flow-row {
    display: flex;
    align-items: center;
    gap: calc(var(--s) * 10px);
  }

  .chip {
    font-size: calc(var(--s) * 19px);
    font-weight: 900;
    padding: calc(var(--s) * 8px) calc(var(--s) * 18px);
    border-radius: 999px;
    line-height: 1.1;
    white-space: nowrap;
  }

  .chip-night {
    background: #111622;
    color: #FFD13B;
    border: calc(var(--s) * 2.5px) solid #111622;
    box-shadow: calc(var(--s) * 3px) calc(var(--s) * 3px) 0 #0E86FF;
    transform: rotate(-2deg);
  }

  .chip-step {
    background: #FFFFFF;
    color: #111622;
    border: calc(var(--s) * 2.5px) solid #111622;
    box-shadow: calc(var(--s) * 3px) calc(var(--s) * 3px) 0 #D5DCE6;
  }
  .chip-step.tilt-p { transform: rotate(1.6deg); }
  .chip-step.tilt-m { transform: rotate(-1.4deg); }

  .chip-done {
    background: #00B89C;
    color: #FFFFFF;
    border: calc(var(--s) * 2.5px) solid #0D0E12;
    box-shadow: calc(var(--s) * 3px) calc(var(--s) * 3px) 0 #0D0E12;
    transform: rotate(1.8deg);
  }

  .flow-arrow {
    font-size: calc(var(--s) * 20px);
    font-weight: 900;
    color: #8C95A6;
    user-select: none;
  }

  /* Footer safely centered in bottom open space >= 44px from bottom edge on ALL sizes */
  .footer {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: calc(var(--s) * 14px);
    white-space: nowrap;
  }

  .credit {
    font-size: calc(var(--s) * 18px);
    font-weight: 700;
    color: #5A6270;
  }

  .sep {
    color: #C4CBD6;
    font-weight: 700;
    font-size: calc(var(--s) * 18px);
  }

  .brand {
    font-size: calc(var(--s) * 20px);
    font-weight: 900;
    color: #0D0E12;
    letter-spacing: -0.01em;
  }

  /* Note 1280x670 aspect tuning */
  body.mode-note .hero-line1 { font-size: calc(var(--s) * 74px); }
  body.mode-note .hero-line2 { font-size: calc(var(--s) * 63px); }
  body.mode-note .hero-title { margin-bottom: calc(var(--s) * 16px); }
  body.mode-note .quote-card {
    padding: calc(var(--s) * 14px) calc(var(--s) * 30px) calc(var(--s) * 14px) calc(var(--s) * 34px);
    margin-bottom: calc(var(--s) * 18px);
  }
  body.mode-note .quote-en { font-size: calc(var(--s) * 31px); }
  body.mode-note .quote-jp { font-size: calc(var(--s) * 23px); }
  body.mode-note .top-row { margin-bottom: calc(var(--s) * 13px); }
  body.mode-note .content { padding-bottom: 48px; }
  body.mode-note .footer { bottom: 44px; }
</style>
</head>
<body>
<div class="stage">

    <path d="M 1228 625 A 200 200 0 0 0 1185 725" fill="none" stroke="#FF5E00" stroke-width="5" stroke-linecap="round" opacity="0.45"/>

    <!-- Crisp geometric sparkles & confetti dots -->
    <path d="M 1190 110 Q 1190 132 1212 132 Q 1190 132 1190 154 Q 1190 132 1168 132 Q 1190 132 1190 110 Z" fill="#FF5E00"/>
    <path d="M 164 405 Q 164 423 182 423 Q 164 423 164 441 Q 164 423 146 423 Q 164 423 164 405 Z" fill="#0E86FF"/>
    <path d="M 1455 442 Q 1455 460 1473 460 Q 1455 460 1455 478 Q 1455 460 1437 460 Q 1455 460 1455 442 Z" fill="#00B89C"/>
    <circle cx="515" cy="765" r="7" fill="#00B89C"/>
    <circle cx="1358" cy="405" r="7" fill="#FF2B4A"/>
    <circle cx="965" cy="118" r="7" fill="#FFD13B"/>
    <g transform="translate(260, 488) rotate(18)">
      <rect x="-11" y="-3" width="22" height="6" rx="3" fill="#8A54FF"/>
      <rect x="-3" y="-11" width="6" height="22" rx="3" fill="#8A54FF"/>
    </g>

    <!-- 1. TOP-LEFT: Giant Teal Scalloped Cloud Character -->
    <g transform="translate(152, 114) rotate(14)">
      <path d="M 95 -105 C 118 -132, 140 -132, 152 -118" fill="none" stroke="#00B89C" stroke-width="11" stroke-linecap="round"/>
      <circle cx="157" cy="-115" r="14" fill="#00B89C"/>

               C -160 -85, -105 -140, -40 -130
               C -10 -175, 78 -172, 108 -122
               C 168 -118, 195 -52, 160 2

      <g transform="translate(36, 26) rotate(10)">
        <path d="M -52 12 C -46 -18, -14 -18, -8 12" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round"/>
        <path d="M 14 12 C 20 -18, 52 -18, 58 12" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Floating crisp checkmark badge popping off Teal Character -->
    <g transform="translate(328, 286) rotate(-11)">
      <rect x="-25" y="-21" width="54" height="46" rx="14" fill="#0D0E12"/>
      <rect x="-28" y="-24" width="54" height="46" rx="14" fill="#FFFFFF" stroke="#0D0E12" stroke-width="3"/>
      <path d="M -11 -1 L -3 7 L 13 -10" fill="none" stroke="#00B89C" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 2. UPPER-MID-LEFT: Floating Purple Round Buddy (unified clean white pill eyes!) -->
    <g transform="translate(458, 134) rotate(-16)">
      <line x1="0" y1="-62" x2="0" y2="-82" stroke="#8A54FF" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="-88" r="10" fill="#8A54FF"/>
      <circle cx="0" cy="0" r="62" fill="#8A54FF"/>
      <g transform="translate(8, 14) rotate(24)">
        <rect x="-24" y="-18" width="16" height="38" rx="8" fill="#FFFFFF"/>
        <rect x="6" y="-18" width="16" height="38" rx="8" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- 3. TOP-RIGHT: Giant Electric Blue Fluffy Blob Character -->
    <g transform="translate(1485, 138) rotate(-14)">
      <path d="M -185 -15
               C -215 -92, -150 -178, -58 -168
               C 5 -225, 125 -212, 168 -135
               C 235 -110, 245 8, 185 80
               C 205 162, 118 228, 35 198
               C -35 232, -145 198, -165 118
               C -225 90, -225 18, -185 -15 Z"
            fill="#0E86FF"/>
      <g transform="translate(-72, 26) rotate(-6)">
        <rect x="-56" y="-42" width="32" height="82" rx="16" fill="#FFFFFF"/>
        <rect x="8" y="-48" width="32" height="82" rx="16" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Floating crisp code badge flying off Blue Character (with crisp flat shadow) -->
    <g transform="translate(1258, 250) rotate(9)">
      <rect x="-43" y="-19" width="92" height="44" rx="14" fill="#0D0E12"/>
      <rect x="-46" y="-22" width="92" height="44" rx="14" fill="#FFFFFF" stroke="#0D0E12" stroke-width="3"/>
      <text x="0" y="8" text-anchor="middle" font-family="M PLUS 1 Code, monospace" font-weight="900" font-size="22" fill="#0E86FF">&lt;/&gt;</text>
    </g>

    <!-- 4. BOTTOM-LEFT: MASSIVE Jet Black Night-Runner Blob -->
    <g transform="translate(132, 822) rotate(22)">
      <ellipse cx="0" cy="0" rx="285" ry="245" fill="#0B0C0F"/>
      <g transform="translate(65, -72) rotate(12)">
        <rect x="-66" y="-54" width="38" height="102" rx="19" fill="#FFFFFF"/>
        <rect x="14" y="-60" width="38" height="102" rx="19" fill="#FFFFFF"/>
      </g>

    <!-- Crisp Golden Crescent Moon + playful Zzz -->
    <g transform="translate(105, 515) rotate(-14)">
      <path d="M 18 -26 A 28 28 0 1 0 18 26 A 21 21 0 1 1 18 -26 Z" fill="#FFB800"/>

    <g font-family="Inter, sans-serif" font-weight="900" fill="#0E86FF">

    <g transform="translate(1116, 772) rotate(13) scale(0.86)">
      <path d="M 0 64
               C -46 38, -74 2, -62 -36
               C -52 -66, -16 -68, 0 -42
               C 16 -68, 52 -66, 62 -36
               C 74 2, 46 38, 0 64 Z"
            fill="#FF2B4A"/>

        <rect x="6" y="-20" width="14" height="36" rx="7" fill="#FFFFFF"/>
      </g>

  </svg>

  <!-- Center Hero Content -->
  <div class="content">
    <div class="top-row">
      <span class="pill-black">pstack</span>
      <span class="pill-orange">10分で一撃理解</span>
      <span class="dev-label">poteto（ローレン・タン）開発</span>
    </div>

    <h1 class="hero-title">
      <span class="hero-line1">寝てる間に自動で動く</span>
      <span class="hero-line2">AIエージェントを誰でも作れる。</span>
    </h1>

    <div class="quote-card">
      <div class="quote-stripe"></div>
      <div class="quote-en">“All Code Is <span class="accent-orange">Slop</span> (Except Mine).”</div>
      <div class="quote-jp">
        全てのコードは<span class="accent-orange">ゴミ</span><span class="accent-blue">（私以外はな）</span>
        <span class="quote-by">— poteto</span>
      </div>
    </div>

    <div class="flow-row">
      <span class="chip chip-night">☾ Zzz 夜間自律</span>
      <span class="flow-arrow">→</span>
      <span class="chip chip-step tilt-p">設計</span>
      <span class="flow-arrow">→</span>
      <span class="chip chip-step tilt-m">実装</span>
      <span class="flow-arrow">→</span>
      <span class="chip chip-step tilt-p">自動テスト・検証</span>
      <span class="flow-arrow">→</span>
      <span class="chip chip-done">朝には完了 ✓</span>
    </div>
  </div>

  <div class="footer" id="footer"></div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const w = parseInt(p.get('w') || '1600', 10);
  const h = parseInt(p.get('h') || '900', 10);
  const mode = p.get('mode') || 'techblog';
  const s = w / 1600;
  document.documentElement.style.setProperty('--w', w + 'px');
  document.documentElement.style.setProperty('--h', h + 'px');
  document.documentElement.style.setProperty('--s', s);
  if (mode === 'note') document.body.classList.add('mode-note');

  const footer = document.getElementById('footer');
  if (mode === 'techblog') {
    footer.innerHTML = '<span class="credit">作図：萩野貴拓</span><span class="sep">|</span><span class="brand">カンリー Techブログ</span>';
  } else {
    footer.innerHTML = '<span class="credit">作図：萩野貴拓</span>';
  }
</script>
</body>
</html>
