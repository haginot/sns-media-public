<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>pstack banner v2 A</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #F4F5F7; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #F4F5F7; color: #111111;
    font-family: "Inter", "Noto Sans CJK JP", sans-serif; font-feature-settings: "palt"; }
  .tech #stage { width: 1600px; height: 900px; }
  .note #stage { width: 1280px; height: 670px; }

  .topbar { position: absolute; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .tech .topbar { left: 80px; top: 58px; right: 80px; }
  .note .topbar { left: 56px; top: 44px; right: 56px; gap: 12px; }

  .pill { display: inline-flex; align-items: center; background: #111111; color: #FFFFFF; border-radius: 999px; font-weight: 700; }
  .pill.orange { background: #FF6801; color: #FFFFFF; margin-left: auto; }
  .pill.blue { background: #1386FF; color: #FFFFFF; }
  .tech .topbar .pill { padding: 7px 22px 8px; font-size: 26px; }
  .note .topbar .pill { padding: 5px 16px 6px; font-size: 21px; }
  .topbar .dev { font-weight: 700; color: #111111; }
  .tech .topbar .dev { font-size: 30px; }
  .note .topbar .dev { font-size: 24px; }

  .quote-block { position: absolute; }
  .tech .quote-block { left: 80px; right: 80px; top: 132px; }
  .note .quote-block { left: 56px; right: 56px; top: 96px; }

  .q-en { font-family: "Inter", sans-serif; font-weight: 900; letter-spacing: -0.04em; line-height: 1.04; color: #111111; white-space: nowrap; }
  .tech .q-en { font-size: 86px; }
  .note .q-en { font-size: 68px; }
  .q-en .slop { color: #FF6801; }

  .q-jp { font-weight: 900; letter-spacing: -0.03em; line-height: 1.15; color: #111111; white-space: nowrap; }
  .tech .q-jp { font-size: 74px; margin-top: 12px; }
  .note .q-jp { font-size: 56px; margin-top: 8px; }
  .q-jp .slop { color: #FF6801; }
  .q-jp .me { color: #1386FF; }

  .card { position: absolute; background: #FFFFFF; border: 2px solid #E1E3E8; box-shadow: 0 4px 0 #E1E3E8; display: flex; align-items: stretch; }
  .tech .card { left: 80px; right: 80px; top: 382px; height: 400px; border-radius: 34px; padding: 34px 38px; gap: 36px; }
  .note .card { left: 56px; right: 56px; top: 288px; height: 304px; border-radius: 26px; padding: 24px 28px; gap: 26px; }

  .card-left { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .tagrow { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .tech .tagrow .pill { padding: 6px 20px 7px; font-size: 26px; }
  .note .tagrow .pill { padding: 4px 16px 5px; font-size: 21px; }
  .tagrow .t { font-weight: 700; color: #3C4043; }
  .tech .tagrow .t { font-size: 28px; }
  .note .tagrow .t { font-size: 22px; }

  .payoff { font-weight: 900; letter-spacing: -0.03em; line-height: 1.2; color: #111111; }
  .tech .payoff { font-size: 50px; }
  .note .payoff { font-size: 38px; }
  .payoff .hl { color: #1386FF; }

  .steps { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .step-chip { background: #F4F5F7; border: 1.5px solid #E1E3E8; border-radius: 999px; font-weight: 700; color: #111111; }
  .tech .step-chip { padding: 8px 20px; font-size: 24px; }
  .note .step-chip { padding: 6px 15px; font-size: 19px; }
  .step-arr { color: #9AA0A6; font-weight: 900; }
  .tech .step-arr { font-size: 24px; }
  .note .step-arr { font-size: 19px; }

  .night { flex: 0 0 auto; background: #141821; border-radius: 24px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
  .tech .night { width: 470px; padding: 24px 26px; border-radius: 24px; }
  .note .night { width: 376px; padding: 18px 20px; border-radius: 20px; }

  .night-top { display: flex; align-items: center; justify-content: space-between; white-space: nowrap; }
  .moon-tag { display: inline-flex; align-items: center; gap: 8px; color: #FFB800; font-weight: 800; }
  .tech .moon-tag { font-size: 23px; }
  .note .moon-tag { font-size: 18px; }
  .status-pill { background: #1386FF; color: #FFFFFF; border-radius: 999px; font-weight: 700; }
  .tech .status-pill { font-size: 20px; padding: 5px 14px 6px; }
  .note .status-pill { font-size: 16px; padding: 4px 11px 5px; }

  .crew { display: flex; align-items: flex-end; justify-content: center; gap: 22px; }
  .tech .crew { margin: 8px 0; }
  .note .crew { margin: 4px 0; gap: 16px; }

  .night-bar { display: flex; align-items: center; justify-content: space-between; background: #1F2533; border-radius: 14px; color: #FFFFFF; font-weight: 700; white-space: nowrap; }
  .tech .night-bar { padding: 12px 18px; font-size: 21px; }
  .note .night-bar { padding: 9px 14px; font-size: 17px; }
  .night-bar .ok-txt { color: #00E5B4; }

  .peek { position: absolute; }
  .peek svg { width: 100% !important; height: auto !important; }
  .tech .peek.p1 { right: 112px; width: 66px; }
  .tech .peek.p2 { right: 186px; width: 48px; }
  .note .peek.p1 { right: 84px; width: 52px; }
  .note .peek.p2 { right: 144px; width: 38px; }

  .foot { position: absolute; white-space: nowrap; }
  .tech .foot.credit { left: 82px; bottom: 56px; color: #5F6368; font-size: 22px; font-weight: 500; }
  .tech .foot.brand { right: 80px; bottom: 56px; color: #111111; font-size: 26px; font-weight: 800; }
  .note .foot.credit { right: 56px; bottom: 42px; color: #5F6368; font-size: 18px; font-weight: 500; }
  .note .foot.brand { display: none; }
</style></head>
<body class="tech">
<div id="stage">
  <div class="topbar">
    <span class="pill">pstack 開発者</span>
    <span class="dev">poteto（ローレン・タン）</span>
    <span class="pill orange">10分で一撃理解</span>
  </div>
  <div class="quote-block">
    <div class="q-en">“All Code Is <span class="slop">Slop</span> (Except Mine).”</div>
    <div class="q-jp">全てのコードは<span class="slop">ゴミ</span>（<span class="me">私以外はな</span>）</div>
  </div>
  <div class="card">
    <div class="card-left">
      <div class="tagrow">
        <span class="pill">pstack</span>
        <span class="t" id="sub">10分でわかる実践ガイド</span>
      </div>
      <div class="payoff"><span class="hl">寝てる間に自動で動く</span><br>AIエージェントを誰でも作れる。</div>
      <div class="steps">
        <span class="step-chip">設計</span><span class="step-arr">→</span>
        <span class="step-chip">実装</span><span class="step-arr">→</span>
        <span class="step-chip">自動テスト・検証</span>
      </div>
    </div>
    <div class="night">
      <div class="night-top">
        <span class="moon-tag">
          <svg width="24" height="24" viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5Z" fill="#FFB800"/></svg>
          Zzz 寝ている間
        </span>
        <span class="status-pill">自律で稼働中</span>
      </div>
      <div class="crew" id="crew"></div>
      <div class="night-bar">
        <span>設計 → 実装 → 検証</span>
        <span class="ok-txt">朝には完了</span>
      </div>
    </div>
  </div>
  <div class="peek p1" id="p1"></div>
  <div class="peek p2" id="p2"></div>
  <div class="foot credit">作図：萩野貴拓</div>
  <div class="foot brand" id="brand">カンリー Techブログ</div>
</div>
<script src="chars.js"></script>
<script>
window.renderVariant = function (mode, brand) {
  document.body.className = mode;
  document.getElementById('brand').textContent = brand || '';
  const s = mode === 'tech' ? 1 : 0.78;
  document.getElementById('crew').innerHTML =
    bot({ kind: 'box', color: '#FF6801', size: Math.round(92 * s), look: [0.5, -0.1] }) +
    bot({ kind: 'mochi', color: '#1386FF', size: Math.round(124 * s), look: [0.2, -0.2] }) +
    bot({ kind: 'round', color: '#00BBA6', size: Math.round(96 * s), look: [-0.5, -0.1] });
  document.getElementById('p1').innerHTML = bot({ kind: 'round', color: '#FF309C', size: Math.round(66 * s), look: [-0.5, 0.5] });
  document.getElementById('p2').innerHTML = bot({ kind: 'box', color: '#9259FE', size: Math.round(48 * s), look: [0.5, 0.5] });
  const cardTop = document.querySelector('.card').offsetTop;
  document.querySelectorAll('.peek').forEach((p) => { p.style.top = (cardTop - p.offsetHeight + 4) + 'px'; });
};
</script>
</body></html>
