<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: var(--w); height: var(--h); overflow: hidden;
    background: #F8F9F7;
    font-family: "Inter Tight", "Inter", "Noto Sans CJK JP", "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; width: var(--w); height: var(--h); background: #F8F9F7; overflow: hidden; }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  .content {
    position: relative; z-index: 10; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-bottom: calc(var(--s) * 44px);
  }

  .top-row {
    display: flex; align-items: center; gap: calc(var(--s) * 12px);
    margin-bottom: calc(var(--s) * 16px);
  }
  .pill-black {
    background: #0D0E12; color: #FFFFFF; font-family: "Inter", sans-serif;
    font-weight: 900; font-size: calc(var(--s) * 24px);
    padding: calc(var(--s) * 7px) calc(var(--s) * 20px); border-radius: 999px; line-height: 1.1;
  }
  .pill-orange {
    background: #FF5E00; color: #FFFFFF; font-weight: 900; font-size: calc(var(--s) * 21px);
    padding: calc(var(--s) * 8px) calc(var(--s) * 18px); border-radius: 999px; line-height: 1.1;
    transform: rotate(-1.6deg);
    box-shadow: calc(var(--s) * 3px) calc(var(--s) * 3px) 0 #0D0E12;
  }
  .dev-label {
    font-size: calc(var(--s) * 21px); font-weight: 800; color: #262C38;
    background: #FFFFFF; border: calc(var(--s) * 2px) solid #D8DFE9;
    padding: calc(var(--s) * 6px) calc(var(--s) * 16px); border-radius: 999px;
  }

  .hero {
    text-align: center; line-height: 1.12; letter-spacing: -0.035em;
    margin-bottom: calc(var(--s) * 22px);
  }
  .hero .l1 { display: block; font-size: calc(var(--s) * 84px); font-weight: 900; color: #0E86FF; }
  .hero .l2 { display: block; font-size: calc(var(--s) * 71px); font-weight: 900; color: #0D0E12; margin-top: calc(var(--s) * 4px); }

  /* HIGH-CONTRAST JET-BLACK QUOTE CARD anchoring the airy bright canvas */
  .quote-dark {
    position: relative;
    background: #0E121D;
    color: #FFFFFF;
    border-radius: calc(var(--s) * 24px);
    padding: calc(var(--s) * 20px) calc(var(--s) * 40px) calc(var(--s) * 20px) calc(var(--s) * 46px);
    box-shadow: calc(var(--s) * 7px) calc(var(--s) * 7px) 0 #FF5E00;
    transform: rotate(-0.9deg);
    text-align: center;
    margin-bottom: calc(var(--s) * 26px);
  }
  .quote-dark-bar {
    position: absolute; left: calc(var(--s) * 14px); top: calc(var(--s) * 15px); bottom: calc(var(--s) * 15px);
    width: calc(var(--s) * 8px); border-radius: 999px; background: #FF5E00;
  }
  .q-en {
    font-family: "Inter", sans-serif; font-size: calc(var(--s) * 36px); font-weight: 900;
    color: #FFFFFF; letter-spacing: -0.03em; line-height: 1.15;
  }
  .q-en span { color: #FF7824; }
  .q-jp {
    margin-top: calc(var(--s) * 7px); font-size: calc(var(--s) * 26px); font-weight: 900;
    color: #F2F5FC; letter-spacing: -0.02em; line-height: 1.2;
  }
  .q-jp .o { color: #FFD13B; }
  .q-jp .b { color: #47B4FF; }
  .q-jp .by { font-size: calc(var(--s) * 18px); font-weight: 700; color: #94A3B8; margin-left: calc(var(--s) * 10px); }

  .flow-row { display: flex; align-items: center; gap: calc(var(--s) * 10px); }
  .chip {
    font-size: calc(var(--s) * 19px); font-weight: 900;
    padding: calc(var(--s) * 8px) calc(var(--s) * 18px); border-radius: 999px; white-space: nowrap;
  }
  .chip-night { background: #FFF2C2; color: #0D0E12; border: calc(var(--s) * 2.5px) solid #0D0E12; transform: rotate(-1.8deg); }
  .chip-step { background: #FFFFFF; color: #111622; border: calc(var(--s) * 2.5px) solid #D0D7E4; }
  .chip-done {
    background: #00B89C; color: #FFFFFF; border: calc(var(--s) * 2.5px) solid #0D0E12;
    box-shadow: calc(var(--s) * 3px) calc(var(--s) * 3px) 0 #0D0E12; transform: rotate(1.6deg);
  }
  .arr { color: #94A3B8; font-weight: 900; font-size: calc(var(--s) * 20px); }

  .footer {
    position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); z-index: 20;
    display: flex; align-items: center; gap: calc(var(--s) * 14px); white-space: nowrap;
  }
  .credit { font-size: calc(var(--s) * 18px); font-weight: 700; color: #5A6270; }
  .sep { color: #C4CBD6; font-weight: 700; font-size: calc(var(--s) * 18px); }
  .brand { font-size: calc(var(--s) * 20px); font-weight: 900; color: #0D0E12; }

  body.mode-note .hero .l1 { font-size: calc(var(--s) * 76px); }
  body.mode-note .hero .l2 { font-size: calc(var(--s) * 64px); }
  body.mode-note .hero { margin-bottom: 16px; }
  body.mode-note .quote-dark { padding: 14px 30px 14px 36px; margin-bottom: 18px; }
  body.mode-note .q-en { font-size: calc(var(--s) * 31px); }
  body.mode-note .q-jp { font-size: calc(var(--s) * 23px); }
  body.mode-note .top-row { margin-bottom: 13px; }
  body.mode-note .content { padding-bottom: 48px; }
  body.mode-note .footer { bottom: 44px; }
</style>
</head>
<body>
<div class="stage">

    <path d="M -60 440 C 160 220, 420 115, 750 92 C 1100 66, 1380 180, 1650 380"

    <g transform="translate(132, 822) rotate(22)">

    <g transform="translate(1488, 808) rotate(-18)">

  <div class="content">
    <div class="top-row">
      <span class="pill-black">pstack</span>
      <span class="pill-orange">10分で一撃理解</span>
      <span class="dev-label">poteto（ローレン・タン）開発</span>

    <h1 class="hero">
      <span class="l1">寝てる間に自動で動く</span>
      <span class="l2">AIエージェントを誰でも作れる。</span>

    <div class="quote-dark">
      <div class="quote-dark-bar"></div>
      <div class="q-en">“All Code Is <span>Slop</span> (Except Mine).”</div>
      <div class="q-jp">
        全てのコードは<span class="o">ゴミ</span><span class="b">（私以外はな）</span>

    <div class="flow-row">
      <span class="chip chip-night">☾ Zzz 夜間自律</span>

      <span class="chip chip-step">実装</span>
      <span class="arr">→</span>
      <span class="chip chip-step">自動テスト・検証</span>

      <span class="chip chip-done">朝には完了 ✓</span>

  <div class="footer" id="footer"></div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const w = parseInt(p.get('w') || '1600', 10);
  const h = parseInt(p.get('h') || '900', 10);
  const mode = p.get('mode') || 'techblog';
  document.documentElement.style.setProperty('--w', w + 'px');
  document.documentElement.style.setProperty('--h', h + 'px');
  document.documentElement.style.setProperty('--s', w / 1600);
  if (mode === 'note') document.body.classList.add('mode-note');
  const f = document.getElementById('footer');
  f.innerHTML = mode === 'techblog'
    ? '<span class="credit">作図：萩野貴拓</span><span class="sep">|</span><span class="brand">カンリー Techブログ</span>'
    : '<span class="credit">作図：萩野貴拓</span>';
</script>
</body>
</html>
