<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: var(--w); height: var(--h); overflow: hidden;
    background: #F8F9F7;
    font-family: "Inter Tight", "Inter", "Noto Sans CJK JP", "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; width: var(--w); height: var(--h); background: #F8F9F7; overflow: hidden; }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  .content {
    position: relative; z-index: 10; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-bottom: calc(var(--s) * 44px);
  }

  .top-row {
    display: flex; align-items: center; gap: calc(var(--s) * 12px);
    margin-bottom: calc(var(--s) * 16px);
  }
  .pill-black {
    background: #0D0E12; color: #FFFFFF; font-family: "Inter", sans-serif;
    font-weight: 900; font-size: calc(var(--s) * 25px);
    padding: calc(var(--s) * 7px) calc(var(--s) * 22px); border-radius: 999px; line-height: 1.1;
    transform: rotate(-1.5deg);
    box-shadow: calc(var(--s) * 3px) calc(var(--s) * 3px) 0 #0E86FF;
  }
  .pill-orange {
    background: #FF5E00; color: #FFFFFF; font-weight: 900; font-size: calc(var(--s) * 22px);
    padding: calc(var(--s) * 8px) calc(var(--s) * 20px); border-radius: 999px; line-height: 1.1;
    transform: rotate(1.8deg);
    box-shadow: calc(var(--s) * 3px) calc(var(--s) * 3px) 0 #0D0E12;
  }
  .dev-label {
    font-size: calc(var(--s) * 20px); font-weight: 800; color: #262C38;
    background: #FFFFFF; border: calc(var(--s) * 2px) solid #D8DFE9;
    padding: calc(var(--s) * 6px) calc(var(--s) * 16px); border-radius: 999px;
  }

  .hero {
    text-align: center; line-height: 1.11; letter-spacing: -0.035em;
    margin-bottom: calc(var(--s) * 20px);
    transform: rotate(-0.6deg);
  }
  .hero .l1 {
    display: inline-block; font-size: calc(var(--s) * 82px); font-weight: 900; color: #0E86FF;
    background: linear-gradient(transparent 74%, #D9EEFF 74%, #D9EEFF 96%, transparent 96%);
    padding: 0 calc(var(--s) * 10px);
  }
  .hero .l2 { display: block; font-size: calc(var(--s) * 70px); font-weight: 900; color: #0D0E12; margin-top: calc(var(--s) * 4px); }

  /* Crisp enlarged quote card with orange corner badge feel */
  .quote-card {
    position: relative;
    background: #FFFFFF;
    border: calc(var(--s) * 3px) solid #0D0E12;
    border-radius: calc(var(--s) * 24px);
    padding: calc(var(--s) * 20px) calc(var(--s) * 42px) calc(var(--s) * 20px) calc(var(--s) * 48px);
    box-shadow: calc(var(--s) * 6px) calc(var(--s) * 6px) 0 #0E86FF;
    transform: rotate(0.7deg);
    text-align: center;
    margin-bottom: calc(var(--s) * 24px);
  }
  .quote-bar {
    position: absolute; left: calc(var(--s) * 14px); top: calc(var(--s) * 14px); bottom: calc(var(--s) * 14px);
    width: calc(var(--s) * 8px); border-radius: 999px; background: #FF5E00;
  }
  .q-en {
    font-family: "Inter", sans-serif; font-size: calc(var(--s) * 38px); font-weight: 900;
    color: #0D0E12; letter-spacing: -0.03em; line-height: 1.14;
  }
  .q-en span { color: #FF5E00; }
  .q-jp {
    margin-top: calc(var(--s) * 7px); font-size: calc(var(--s) * 27px); font-weight: 900;
    color: #1F242D; letter-spacing: -0.02em; line-height: 1.2;
  }
  .q-jp .o { color: #FF5E00; }
  .q-jp .b { color: #0E86FF; }
  .q-jp .by { font-size: calc(var(--s) * 18px); font-weight: 700; color: #5C6472; margin-left: calc(var(--s) * 10px); }

  .flow-row { display: flex; align-items: center; gap: calc(var(--s) * 10px); }
  .chip {
    font-size: calc(var(--s) * 19px); font-weight: 900;
    padding: calc(var(--s) * 8px) calc(var(--s) * 18px); border-radius: 999px; white-space: nowrap;
  }
  .chip-night {
    background: #111622; color: #FFD13B; border: calc(var(--s) * 2.5px) solid #111622;
    box-shadow: calc(var(--s) * 3px) calc(var(--s) * 3px) 0 #0E86FF; transform: rotate(-2.2deg);
  }
  .chip-step {
    background: #FFFFFF; color: #111622; border: calc(var(--s) * 2.5px) solid #111622;
    box-shadow: calc(var(--s) * 3px) calc(var(--s) * 3px) 0 #D5DCE6;
  }
  .chip-step.tp { transform: rotate(1.8deg); }
  .chip-step.tm { transform: rotate(-1.6deg); }
  .chip-done {
    background: #00B89C; color: #FFFFFF; border: calc(var(--s) * 2.5px) solid #0D0E12;
    box-shadow: calc(var(--s) * 3px) calc(var(--s) * 3px) 0 #0D0E12; transform: rotate(2deg);
  }
  .arr { color: #8C95A6; font-weight: 900; font-size: calc(var(--s) * 20px); }

  .footer {
    position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); z-index: 20;
    display: flex; align-items: center; gap: calc(var(--s) * 14px); white-space: nowrap;
  }
  .credit { font-size: calc(var(--s) * 18px); font-weight: 700; color: #5A6270; }
  .sep { color: #C4CBD6; font-weight: 700; font-size: calc(var(--s) * 18px); }
  .brand { font-size: calc(var(--s) * 20px); font-weight: 900; color: #0D0E12; }

  body.mode-note .hero .l1 { font-size: calc(var(--s) * 74px); }
  body.mode-note .hero .l2 { font-size: calc(var(--s) * 63px); }
  body.mode-note .hero { margin-bottom: 14px; }
  body.mode-note .quote-card { padding: 14px 32px 14px 38px; margin-bottom: 18px; }
  body.mode-note .q-en { font-size: calc(var(--s) * 33px); }
  body.mode-note .q-jp { font-size: calc(var(--s) * 24px); }
  body.mode-note .top-row { margin-bottom: 12px; }
  body.mode-note .content { padding-bottom: 48px; }
  body.mode-note .footer { bottom: 44px; }
</style>
</head>
<body>
<div class="stage">
  <svg class="art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <!-- Dynamic double orbital tracks + energetic speed lines! -->
    <path d="M -60 445 C 165 215, 425 110, 755 88 C 1105 62, 1385 178, 1655 378"
          fill="none" stroke="#DCE2EC" stroke-width="4.5" stroke-dasharray="14 14" stroke-linecap="round"/>
    <path d="M -40 595 C 260 765, 560 830, 880 802 C 1180 778, 1420 652, 1660 472"
          fill="none" stroke="#DCE2EC" stroke-width="4.5" stroke-dasharray="12 14" stroke-linecap="round"/>

    <!-- Energetic comic-kinetic double speed lines behind leaping corner characters -->
    <g stroke-linecap="round">
      <!-- Top-left teal burst -->
      <line x1="230" y1="285" x2="268" y2="322" stroke="#00B89C" stroke-width="6"/>
      <line x1="196" y1="308" x2="225" y2="345" stroke="#00B89C" stroke-width="5" opacity="0.65"/>
      <!-- Top-right blue burst -->
      <line x1="1295" y1="275" x2="1248" y2="310" stroke="#0E86FF" stroke-width="6"/>
      <line x1="1338" y1="308" x2="1305" y2="348" stroke="#0E86FF" stroke-width="5" opacity="0.65"/>
      <!-- Bottom-left black launch -->
      <line x1="365" y1="628" x2="412" y2="594" stroke="#0D0E12" stroke-width="5.5" opacity="0.32"/>
      <!-- Bottom-right orange launch -->
      <line x1="1252" y1="608" x2="1205" y2="572" stroke="#FF5E00" stroke-width="6" opacity="0.7"/>
      <line x1="1215" y1="648" x2="1172" y2="626" stroke="#FF5E00" stroke-width="5" opacity="0.45"/>
    </g>

    <!-- Crisp sparkles -->
    <path d="M 1190 105 Q 1190 128 1213 128 Q 1190 128 1190 151 Q 1190 128 1167 128 Q 1190 128 1190 105 Z" fill="#FF5E00"/>
    <path d="M 150 385 Q 150 404 169 404 Q 150 404 150 423 Q 150 404 131 404 Q 150 404 150 385 Z" fill="#0E86FF"/>
    <path d="M 1455 435 Q 1455 454 1474 454 Q 1455 454 1455 473 Q 1455 454 1436 454 Q 1455 454 1455 435 Z" fill="#00B89C"/>
    <circle cx="515" cy="768" r="8" fill="#00B89C"/>
    <circle cx="1362" cy="396" r="8" fill="#FF2B4A"/>
    <circle cx="972" cy="112" r="8" fill="#FFD13B"/>

    <!-- 1. TOP-LEFT: Giant Teal Cloud -->
    <g transform="translate(148, 110) rotate(16)">
      <path d="M 95 -105 C 118 -132, 140 -132, 152 -118" fill="none" stroke="#00B89C" stroke-width="11" stroke-linecap="round"/>
      <circle cx="157" cy="-115" r="14" fill="#00B89C"/>
      <path d="M -145 -20 C -160 -85, -105 -140, -40 -130 C -10 -175, 78 -172, 108 -122 C 168 -118, 195 -52, 160 2 C 188 60, 145 128, 82 122 C 45 162, -38 158, -72 115 C -135 120, -178 58, -145 -20 Z" fill="#00B89C"/>
      <g transform="translate(36, 26) rotate(10)">
        <path d="M -52 12 C -46 -18, -14 -18, -8 12" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round"/>
        <path d="M 14 12 C 20 -18, 52 -18, 58 12" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Floating live badge: TEST ✓ popping off Teal -->
    <g transform="translate(292, 258) rotate(-12)">
      <rect x="-56" y="-20" width="116" height="44" rx="14" fill="#0D0E12"/>
      <rect x="-59" y="-23" width="116" height="44" rx="14" fill="#FFFFFF" stroke="#0D0E12" stroke-width="3"/>
      <text x="-1" y="7" text-anchor="middle" font-family="Inter, Noto Sans CJK JP, sans-serif" font-weight="900" font-size="19" fill="#00A88D">14テスト ✓</text>
    </g>

    <!-- 2. UPPER-MID-LEFT: Floating Purple Buddy -->
    <g transform="translate(465, 132) rotate(-18)">
      <line x1="0" y1="-60" x2="0" y2="-80" stroke="#8A54FF" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="-86" r="10" fill="#8A54FF"/>
      <circle cx="0" cy="0" r="60" fill="#8A54FF"/>
      <g transform="translate(8, 13) rotate(24)">
        <rect x="-24" y="-17" width="16" height="36" rx="8" fill="#FFFFFF"/>
        <rect x="6" y="-17" width="16" height="36" rx="8" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- 3. TOP-RIGHT: Giant Electric Blue Cloud -->
    <g transform="translate(1488, 134) rotate(-16)">
      <path d="M -185 -15 C -215 -92, -150 -178, -58 -168 C 5 -225, 125 -212, 168 -135 C 235 -110, 245 8, 185 80 C 205 162, 118 228, 35 198 C -35 232, -145 198, -165 118 C -225 90, -225 18, -185 -15 Z" fill="#0E86FF"/>
      <g transform="translate(-72, 26) rotate(-6)">
        <rect x="-56" y="-42" width="32" height="82" rx="16" fill="#FFFFFF"/>
        <rect x="8" y="-48" width="32" height="82" rx="16" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Floating live badge: </> 自動実装 flying off Blue -->
    <g transform="translate(1278, 228) rotate(10)">
      <rect x="-66" y="-20" width="136" height="44" rx="14" fill="#0D0E12"/>
      <rect x="-69" y="-23" width="136" height="44" rx="14" fill="#FFFFFF" stroke="#0D0E12" stroke-width="3"/>
      <text x="-1" y="7" text-anchor="middle" font-family="M PLUS 1 Code, Noto Sans CJK JP, sans-serif" font-weight="900" font-size="19" fill="#0E86FF">&lt;/&gt; 自動実装</text>
    </g>

    <!-- 4. BOTTOM-LEFT: MASSIVE Jet Black Night-Runner -->
    <g transform="translate(128, 822) rotate(23)">
      <ellipse cx="0" cy="0" rx="285" ry="245" fill="#0B0C0F"/>
      <g transform="translate(65, -72) rotate(12)">
        <rect x="-66" y="-54" width="38" height="102" rx="19" fill="#FFFFFF"/>
        <rect x="14" y="-60" width="38" height="102" rx="19" fill="#FFFFFF"/>
      </g>
    </g>
    <g transform="translate(100, 502) rotate(-14)">
      <path d="M 20 -30 A 32 32 0 1 0 20 30 A 24 24 0 1 1 20 -30 Z" fill="#FFB800"/>
    </g>
    <g font-family="Inter, sans-serif" font-weight="900" fill="#0E86FF">
      <text x="152" y="532" font-size="26" transform="rotate(-12 152 532)">Z</text>
      <text x="182" y="504" font-size="33" transform="rotate(-8 182 504)">z</text>
      <text x="214" y="476" font-size="40" transform="rotate(-4 214 476)">z</text>
    </g>

    <!-- 5. BOTTOM-RIGHT: MASSIVE Vivid Orange Rounded Triangle -->
    <g transform="translate(1488, 808) rotate(-20)">
      <path d="M -230 140 C -275 45, -210 -125, -85 -220 C 5 -290, 125 -265, 195 -140 C 265 -15, 290 120, 210 215 C 130 310, -185 235, -230 140 Z" fill="#FF5E00"/>
      <g transform="translate(-75, -45) rotate(6)">
        <rect x="-58" y="-44" width="34" height="90" rx="17" fill="#FFFFFF"/>
        <rect x="8" y="-50" width="34" height="90" rx="17" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- 6. LOWER-MID-RIGHT: Floating Coral Heart -->
    <g transform="translate(1118, 774) rotate(14) scale(0.86)">
      <path d="M 0 64 C -46 38, -74 2, -62 -36 C -52 -66, -16 -68, 0 -42 C 16 -68, 52 -66, 62 -36 C 74 2, 46 38, 0 64 Z" fill="#FF2B4A"/>
      <g transform="translate(-12, -8) rotate(-8)">
        <rect x="-18" y="-20" width="14" height="36" rx="7" fill="#FFFFFF"/>
        <rect x="6" y="-20" width="14" height="36" rx="7" fill="#FFFFFF"/>
      </g>
    </g>
  </svg>

  <div class="content">
    <div class="top-row">
      <span class="pill-black">pstack</span>
      <span class="pill-orange">10分で一撃理解</span>
      <span class="dev-label">poteto（ローレン・タン）開発</span>
    </div>

    <h1 class="hero">
      <span class="l1">寝てる間に自動で動く</span>
      <span class="l2">AIエージェントを誰でも作れる。</span>
    </h1>

    <div class="quote-card">
      <div class="quote-bar"></div>
      <div class="q-en">“All Code Is <span>Slop</span> (Except Mine).”</div>
      <div class="q-jp">
        全てのコードは<span class="o">ゴミ</span><span class="b">（私以外はな）</span>
        <span class="by">— poteto</span>
      </div>
    </div>

    <div class="flow-row">
      <span class="chip chip-night">☾ Zzz 夜間自律</span>
      <span class="arr">→</span>
      <span class="chip chip-step tp">設計</span>
      <span class="arr">→</span>
      <span class="chip chip-step tm">実装</span>
      <span class="arr">→</span>
      <span class="chip chip-step tp">自動テスト・検証</span>
      <span class="arr">→</span>
      <span class="chip chip-done">朝には完了 ✓</span>
    </div>
  </div>

  <div class="footer" id="footer"></div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const w = parseInt(p.get('w') || '1600', 10);
  const h = parseInt(p.get('h') || '900', 10);
  const mode = p.get('mode') || 'techblog';
  document.documentElement.style.setProperty('--w', w + 'px');
  document.documentElement.style.setProperty('--h', h + 'px');
  document.documentElement.style.setProperty('--s', w / 1600);
  if (mode === 'note') document.body.classList.add('mode-note');
  const f = document.getElementById('footer');
  f.innerHTML = mode === 'techblog'
    ? '<span class="credit">作図：萩野貴拓</span><span class="sep">|</span><span class="brand">カンリー Techブログ</span>'
    : '<span class="credit">作図：萩野貴拓</span>';
</script>
</body>
</html>
