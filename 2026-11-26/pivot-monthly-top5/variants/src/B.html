<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1600px;height:900px;background:#f7f1e6 url(compB_base.png) left top/1600px 900px no-repeat;font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;position:relative;overflow:hidden}
.card{position:absolute;left:292px;top:124px;width:380px;padding:6px;border-radius:16px;background:linear-gradient(135deg,#f6e3b0,#b8893e,#fbefcf,#a77a32);box-shadow:0 12px 28px rgba(90,65,25,.18)}
.card img{width:368px;height:auto;display:block;border-radius:11px}
.type{position:absolute;left:710px;top:124px;width:560px;text-align:left;white-space:nowrap}
.lab{color:#8a6a2e;font-weight:700;font-size:18px;letter-spacing:7px;padding:4px 0;border-top:1.5px solid #c9a55c;border-bottom:1.5px solid #c9a55c;display:inline-block}
.h1{margin-top:12px;font-weight:400;font-size:28px;color:#2b2620;letter-spacing:6px;font-feature-settings:"palt"}
.h2{margin-top:4px;font-family:"Noto Serif CJK JP",serif;font-weight:700;font-size:72px;line-height:1.05;letter-spacing:3px;
  background:linear-gradient(175deg,#fff8e1 0%,#e8c77e 28%,#a9782c 52%,#f3dc9f 70%,#8f6221 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.9)) drop-shadow(0 6px 12px rgba(120,85,30,.3))}
.ep{margin-top:8px;font-weight:700;font-size:20px;color:#2b2620;letter-spacing:1px}
.cr{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;font-weight:400;font-size:16px;color:#7a6a55;letter-spacing:2px;white-space:nowrap}
</style></head><body>
<div class="card"><img src="thumb.png" alt=""></div>
<div class="type">
  <div class="lab">PIVOT</div>
  <div class="h1">月間総合ランキング</div>
  <div class="h2">トップ5入り</div>
  <div class="ep">Meta「Muse」解説</div>
</div>
<div class="cr">作図：萩野貴拓</div>
</body></html>
