<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1600px;height:900px;background:#f7f1e6 url(compC_base.png) left top/1600px 900px no-repeat;font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;position:relative;overflow:hidden}
.c{position:absolute;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
.lab{top:44px;color:#8a6a2e;font-weight:700;font-size:20px;letter-spacing:8px;padding:5px 2px;border-top:1.5px solid #c9a55c;border-bottom:1.5px solid #c9a55c}
.h1{top:92px;font-weight:400;font-size:34px;color:#2b2620;letter-spacing:8px;font-feature-settings:"palt"}
.h2{top:142px;font-family:"Noto Serif CJK JP",serif;font-weight:700;font-size:88px;line-height:1;letter-spacing:4px;
  background:linear-gradient(175deg,#fff8e1 0%,#e8c77e 28%,#a9782c 52%,#f3dc9f 70%,#8f6221 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.9)) drop-shadow(0 8px 14px rgba(120,85,30,.35))}
.card{top:330px;width:500px;padding:6px;background:linear-gradient(135deg,#f6e3b0,#b8893e,#fbefcf,#a77a32);border-radius:18px;box-shadow:0 24px 50px rgba(90,65,25,.22)}
.card img{width:488px;height:auto;display:block;border-radius:13px}
.ep{top:626px;font-weight:700;font-size:24px;color:#2b2620;letter-spacing:2px}
.cr{bottom:32px;font-weight:400;font-size:16px;color:#7a6a55;letter-spacing:2px}
</style></head><body>
<div class="c lab">PIVOT</div>
<div class="c h1">月間総合ランキング</div>
<div class="c h2">トップ5入り</div>
<div class="c card"><img src="thumb.png" alt=""></div>
<div class="c ep">Meta「Muse」解説</div>
<div class="c cr">作図：萩野貴拓</div>
</body></html>
