<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1600px;height:900px;background:#f7f1e6 url(compA_base.png) left top/1600px 900px no-repeat;font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;position:relative;overflow:hidden}
.block{position:absolute;left:56px;top:48px;width:500px;text-align:left;white-space:nowrap}
.lab{color:#8a6a2e;font-weight:700;font-size:20px;letter-spacing:8px;padding:5px 0;border-top:1.5px solid #c9a55c;border-bottom:1.5px solid #c9a55c;display:inline-block}
.h1{margin-top:16px;font-weight:400;font-size:30px;color:#2b2620;letter-spacing:6px;font-feature-settings:"palt"}
.h2{margin-top:8px;font-family:"Noto Serif CJK JP","Noto Serif JP",serif;font-weight:700;font-size:76px;line-height:1.05;letter-spacing:3px;
  background:linear-gradient(175deg,#fff8e1 0%,#e8c77e 28%,#a9782c 52%,#f3dc9f 70%,#8f6221 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.9)) drop-shadow(0 6px 12px rgba(120,85,30,.3))}
.ep{margin-top:10px;font-weight:700;font-size:20px;color:#2b2620;letter-spacing:1px}
.cr{position:absolute;left:56px;bottom:36px;font-weight:400;font-size:16px;color:#7a6a55;letter-spacing:2px}
</style></head><body>
<div class="block">
  <div class="lab">PIVOT</div>
  <div class="h1">月間総合ランキング</div>
  <div class="h2">トップ5入り</div>
  <div class="ep">Meta「Muse」解説</div>
</div>
<div class="cr">作図：萩野貴拓</div>
</body></html>
