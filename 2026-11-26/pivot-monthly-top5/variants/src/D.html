<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1600px;height:900px;background:#f7f1e6 url(compD_base.png) left top/1600px 900px no-repeat;font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;position:relative;overflow:hidden}
.card{position:absolute;left:48px;top:400px;width:560px;padding:7px;border-radius:18px;background:linear-gradient(135deg,#f6e3b0,#b8893e,#fbefcf,#a77a32);box-shadow:0 16px 36px rgba(90,65,25,.18)}
.card img{width:546px;height:auto;display:block;border-radius:12px}
.type{position:absolute;left:56px;top:36px;width:1300px;text-align:left;white-space:nowrap}
.lab{color:#8a6a2e;font-weight:700;font-size:22px;letter-spacing:8px;padding:5px 0;border-top:1.5px solid #c9a55c;border-bottom:1.5px solid #c9a55c;display:inline-block}
.h1{margin-top:14px;font-weight:400;font-size:36px;color:#2b2620;letter-spacing:10px;font-feature-settings:"palt"}
.h2{margin-top:2px;font-family:"Noto Serif CJK JP",serif;font-weight:700;font-size:140px;line-height:1;letter-spacing:4px;
  background:linear-gradient(175deg,#fff8e1 0%,#e8c77e 28%,#a9782c 52%,#f3dc9f 70%,#8f6221 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.95)) drop-shadow(0 8px 16px rgba(120,85,30,.32))}
.ep{position:absolute;left:56px;top:718px;font-weight:700;font-size:22px;color:#2b2620;letter-spacing:1px;white-space:nowrap}
.cr{position:absolute;left:56px;bottom:28px;font-weight:400;font-size:16px;color:#7a6a55;letter-spacing:2px}
</style></head><body>
<div class="card"><img src="thumb.png" alt=""></div>
<div class="type">
  <div class="lab">PIVOT</div>
  <div class="h1">月間総合ランキング</div>
  <div class="h2">トップ5入り</div>
</div>
<div class="ep">Meta「Muse」解説</div>
<div class="cr">作図：萩野貴拓</div>
</body></html>
