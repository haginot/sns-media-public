<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{
  width:1600px;height:900px;
  background:#f7f1e6 url(bg_raw.png) center/cover no-repeat;
  font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;
  position:relative;overflow:hidden;
}
.c{position:absolute;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
.lab{
  top:48px;color:#8a6a2e;font-weight:700;font-size:22px;letter-spacing:8px;
  padding:6px 2px;border-top:1.5px solid #c9a55c;border-bottom:1.5px solid #c9a55c;
}
.h1{top:100px;font-weight:400;font-size:38px;color:#2b2620;letter-spacing:10px;font-feature-settings:"palt"}
.h2{
  top:160px;
  font-family:"Noto Serif CJK JP","Noto Serif JP",serif;
  font-weight:700;font-size:96px;line-height:1;letter-spacing:4px;
  background:linear-gradient(175deg,#fff8e1 0%,#e8c77e 28%,#a9782c 52%,#f3dc9f 70%,#8f6221 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.9)) drop-shadow(0 8px 14px rgba(120,85,30,.35));
}
.card{
  top:415px;left:53.5%;width:500px;padding:6px;
  background:linear-gradient(135deg,#f6e3b0,#b8893e,#fbefcf,#a77a32);
  border-radius:18px;box-shadow:0 24px 50px rgba(90,65,25,.22);
}
.card img{width:488px;height:auto;display:block;border-radius:13px}
.ep{top:710px;left:53.5%;font-weight:700;font-size:24px;color:#2b2620;letter-spacing:2px;font-feature-settings:"palt"}
.cr{bottom:36px;font-weight:400;font-size:17px;color:#7a6a55;letter-spacing:2px}
</style>
</head>
<body>
<div class="c lab">PIVOT</div>
<div class="c h1">月間総合ランキング</div>
<div class="c h2">トップ5入り</div>
<div class="c card"><img src="thumb.png" alt=""></div>
<div class="c ep">Meta「Muse」解説</div>
<div class="c cr">作図：萩野貴拓</div>
</body>
</html>
