<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="zkit.css"></head>
<body><div id="stage"><svg id="fig" width="1600" height="900" viewBox="0 0 1600 900"></svg></div>
<script src="iso.js"></script><script src="zlib.js"></script><script>
// 図7 効くのは、まず知識を渡すこと — values from pivot-ontology-basis paper/frags/frag-abstract.html via figure_brief.md (do not change)
Z.setup({ unit: 100, origin: [800, 450] });
const { el } = Iso;
Z.title('What helps first is <span class="g">providing knowledge</span>');
// chart panel (hides the lattice inside the chart area)
Z.rect(40, 140, 1520, 640, { fill: 'var(--panel)', stroke: 'var(--line)', sw: 1, rx: 8 });
const X0 = 730, PXPT = 14.8, xv = v => X0 + v * PXPT;   // 0..50 pt → 730..1470
const T0 = 196, pitch = 118, bh = 50, axisY = T0 + 4 * pitch - 10;
// ticks + faint vertical guides
for (let v = 0; v <= 50; v += 10) {
  el('line', { x1: xv(v), y1: T0 - 30, x2: xv(v), y2: axisY, stroke: v === 0 ? 'var(--sub)' : 'var(--line)', 'stroke-width': v === 0 ? 2 : 1 });
  Z.at('sub', String(v), xv(v), axisY + 22, { w: 60, a: 'c', style: { color: 'var(--sub)', fontSize: '20px' } });
}
Z.at('sub', 'Points (difference vs. no knowledge, or vs. plain text)', (xv(0) + xv(50)) / 2, axisY + 62, { w: 800, a: 'c', style: { color: 'var(--sub)', fontSize: '20px' } });
const grey = Z.theme === 'dark' ? '#6E7287' : '#A3A6B4', bandC = Z.theme === 'dark' ? '#C9CCD8' : '#4A4E62';
const rows = [
  { name: 'Whether knowledge is provided' },
  { name: 'Same knowledge in ontology form<br>(high difficulty, main analysis)' },
  { name: 'Same (conservative re-analysis)' },
  { name: 'Procedural work (Experiment II)' },
];
rows.forEach((r, i) => {
  const y = T0 + i * pitch;
  Z.at('', `<div style="font-weight:700;font-size:25px;color:var(--ink);line-height:1.3">${r.name}</div>`, X0 - 30, y + bh / 2, { w: 640, a: 'r' });
});
// bar 1: band 25.7–49.3 (0–25.7 faint)
{ const y = T0; el('rect', { x: xv(0), y, width: xv(25.7) - xv(0), height: bh, fill: bandC, opacity: 0.22 });
  el('rect', { x: xv(25.7), y, width: xv(49.3) - xv(25.7), height: bh, fill: bandC });
  Z.at('', `<span style="font-weight:900;font-size:26px;color:var(--bg)">+25.7 to +49.3</span>`, (xv(25.7) + xv(49.3)) / 2, y + bh / 2, { w: 300, a: 'c' }); }
// bar 2: +2.3 (gradient — the one focus)
{ const y = T0 + pitch; el('linearGradient', { id: 'barg', x1: 0, x2: 1, y1: 0, y2: 0 }, document.querySelector('#fig defs'));
  const g = document.getElementById('barg'); [['0', '#CD1DFB'], ['0.5', '#8745E3'], ['1', '#237FC0']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, g));
  el('rect', { x: xv(0), y, width: xv(2.3) - xv(0), height: bh, fill: 'url(#barg)' });
  Z.at('', '<span style="font-weight:900;font-size:27px" class="g">+2.3 (significant)</span>', xv(2.3) + 16, y + bh / 2, { w: 400 }); }
// bar 3: about +2.0 (grey)
{ const y = T0 + 2 * pitch; el('rect', { x: xv(0), y, width: xv(2.0) - xv(0), height: bh, fill: grey });
  Z.at('', '<span style="font-weight:700;font-size:24px;color:var(--body)">≈ +2.0 (not significant after correction)</span>', xv(2.0) + 16, y + bh / 2, { w: 620 }); }
// row 4: no value shown (the article gives no number for Experiment II)
{ const y = T0 + 3 * pitch;
  Z.at('', '<span style="font-weight:700;font-size:25px;color:var(--body)">The form made no difference</span>', xv(0) + 16, y + bh / 2, { w: 500 }); }
Z.at('sub', 'Unpublished, not peer-reviewed. Results from a single fictional business. Analysis covers 2,117 runs', 64, 822, { w: 1400, style: { color: 'var(--sub)', fontSize: '20px' } });
Z.done();
</script></body></html>
